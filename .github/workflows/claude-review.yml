name: Claude review

# Pilot: Claude reads each pull request and posts findings as comments. It never approves
# or merges, and it isn't a required check, so a hiccup here can't block a merge.
# What it looks for is in REVIEW.md. Once it's tuned, this moves into the shared
# newt-app.yml in newt-android-lib so every Newt app gets it.
#
# Needs the CLAUDE_CODE_OAUTH_TOKEN secret (from `claude setup-token`), which runs on the
# Claude subscription rather than a paid API key.
#
# OFF for now: subscription tokens are rejected inside GitHub Actions with a 401
# (anthropics/claude-code-action#1613, #1614). Until that's fixed, Claude runs the same
# review on the owner's computer before each PR and posts it as a comment (see CLAUDE.md).
# To turn this back on, no code change needed:
#   gh variable set CLAUDE_REVIEW_ENABLED --body true -R sec-newt/newt-home

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  # Let a review finish rather than leave half its comments with no summary.
  cancel-in-progress: false

jobs:
  review:
    name: Review
    # Only when switched on, and only the owner's own branches: never forks (no secrets,
    # untrusted text), never Dependabot (its runs don't get this secret), never drafts.
    if: >-
      vars.CLAUDE_REVIEW_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # Keep the job's token out of .git/config, where Claude could read it.
          persist-credentials: false

      - uses: anthropics/claude-code-action@4d75e5f390ee76b2e09c1980ecc99ff3a2e088c8 # v1.0.275
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Comments come from github-actions[bot]; no GitHub App to install.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: origin/${{ github.event.pull_request.base.ref }}

            Review this pull request. Its code is checked out in the working directory (as a
            merge commit, so always pass the PR number to gh).

            1. Read CLAUDE.md and REVIEW.md, and follow REVIEW.md for what matters and how to report.
            2. Read what's already posted:
               `gh pr view ${{ github.event.pull_request.number }} --comments` and
               `gh api --paginate repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments`.
               Never repeat a finding that's already there; say whether earlier ones were fixed.
            3. Read the whole diff (`gh pr diff ${{ github.event.pull_request.number }}`) and open
               the surrounding code before deciding something is wrong. Check every item under
               "What was asked" against what the code really does.
            4. Before posting, check each finding again: could you show it going wrong with the
               file and line? If not, drop it. If you find a kind of bug, say where else it occurs.
            5. Post each finding as an inline comment with
               `mcp__github_inline_comment__create_inline_comment` (`confirmed: true`),
               tagged **Important**, **Nit** or **Pre-existing**.
            6. Post one short summary with `gh pr comment ${{ github.event.pull_request.number }}`,
               starting with the count ("1 important, 2 nits." or "Nothing to fix.").

            Don't edit files, push or approve. Only post comments.
          claude_args: |
            --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api --paginate repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"
