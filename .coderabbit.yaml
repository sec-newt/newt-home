# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit AI review. Tuned to be quiet: real bugs, security, privacy and
# accessibility, not style nitpicks. Delete this file and remove the repo from
# the CodeRabbit GitHub App to turn it off.
language: en-US
tone_instructions: "Be brief and direct. Skip praise. Only comment when something is wrong or risky."

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  collapse_walkthrough: true
  review_details: false
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false

  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords: ["WIP", "[skip review]"]
    ignore_usernames: ["dependabot[bot]"]

  path_filters:
    - "!**/build/**"
    - "!gradle/wrapper/**"

  path_instructions:
    - path: "**/*.kt"
      instructions: |
        This is a private, offline launcher (home screen) for GrapheneOS that looks like a terminal but works by tapping. It has no internet permission. Focus on, in order:
        1. Privacy: app usage, contacts, notifications and anything read from
           other Newt apps must never reach logs or leave the phone. Data
           read from other Newt apps' providers must be treated as untrusted
           and handled when missing.
        2. Correctness: every feature must be able to be switched off, and
           the typed command and the help switch must do the same thing;
           typing is never required. Flag main-thread disk work, coroutine
           cancellation bugs, mutable or implicit PendingIntents, and
           exported components that accept untrusted input.
        3. Accessibility: the primary user has low vision. Flag Compose UI
           missing contentDescription/semantics, buttons under 56dp or rows
           under 48dp, text under 16sp, text colors under 7:1 contrast,
           meaning carried by color alone, duplicate screen-reader labels,
           and animations that ignore the system "remove animations" setting.
        Do not comment on naming, formatting, or minor style.
    - path: "**/AndroidManifest.xml"
      instructions: |
        Flag any new permission (especially INTERNET, which is never allowed), exported component, or intent filter,
        and check it against config/allowed-permissions.txt.
    - path: ".github/workflows/**"
      instructions: |
        Flag unpinned actions (must be pinned to a full commit SHA), widened
        token permissions, and pull_request_target usage.

chat:
  auto_reply: true
